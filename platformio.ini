; Benchmark firmware: src/PerfTests.cpp against AsyncTCP and ESPAsyncWebServer.
;
;   local      the working trees of ../AsyncTCP and ../ESPAsyncWebServer
;   arduino-3  the commits named by BENCH_ASYNCTCP and BENCH_WEBSERVER, which
;              collect.py sets, e.g.
;              BENCH_ASYNCTCP=AsyncTCP=git+file:///path/to/AsyncTCP#<sha>
;   arduino-2  the same, on Arduino 2.  It shares PlatformIO's package store
;              with arduino-3, so never build both in one pio run.

[platformio]
default_envs = local

[env]
framework = arduino
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32dev
; Release configuration: platform-default optimization and no logging, since
; log output under load blocks on the UART and is measured as library cost.
build_flags =
  -Wall -Wextra
  -Wno-unused-parameter
  -D CORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_NONE
  -D CONFIG_ASYNC_TCP_MAX_ACK_TIME=5000
  -D CONFIG_ASYNC_TCP_PRIORITY=10
  -D CONFIG_ASYNC_TCP_QUEUE_SIZE=64
  -D CONFIG_ASYNC_TCP_RUNNING_CORE=1
  -D CONFIG_ASYNC_TCP_STACK_SIZE=4096
upload_protocol = esptool
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_compat_mode = strict
lib_ldf_mode = chain

[env:local]
lib_deps =
  AsyncTCP = symlink://../AsyncTCP
  ESPAsyncWebServer = symlink://../ESPAsyncWebServer

[env:arduino-3]
lib_deps =
  ${sysenv.BENCH_ASYNCTCP}
  ${sysenv.BENCH_WEBSERVER}

[env:arduino-2]
platform = espressif32@6.12.0
lib_deps = ${env:arduino-3.lib_deps}
extra_scripts = post:merge_factory.py
